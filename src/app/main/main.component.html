<div class="coverpage" [ngStyle]="list?{'background-image': 'url(' + apiUrl +list?.picurl + ')'}:{}">
    <div class="coverimg">
        <div class="container">
            <div class="d-flex item-align-center" style="height: 100vh">
                <div class="col-lg-10 col-md-12 mx-auto my-auto text-center">
                    <img src="assets/images/logo1.png" class="w-50 coverlogo" alt="">
                    <div class="row mt-5">
                        <div class="col-lg-4 col-md-12 col-sm-12">
                            <div class="covermain m-1 p-4">
                                <a routerLink="/home">
                                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-50">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25">
                                        </path>
                                    </svg>
                                    <div class="mt-1">Үндсэн сайт</div>
                                </a>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-12 col-sm-12">
                            <div class="covermain m-1 p-4">
                                <a href="https://license.frc.mn/">
                                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-50">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z">
                                        </path>
                                    </svg>
                                    <div class="mt-1">Зөвшөөрлийн цахим систем</div>
                                </a>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-12 col-sm-12">
                            <div class="covermain m-1 p-4">
                                <a [routerLink]="['/contact',{id:47}]">
                                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                                        xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-50">
                                        <path stroke-linecap="round"
                                            d="M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zm0 0c0 1.657 1.007 3 2.25 3S21 13.657 21 12a9 9 0 10-2.636 6.364M16.5 12V8.25">
                                        </path>
                                    </svg>
                                    <div class="mt-1">Холбоо барих</div>
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
