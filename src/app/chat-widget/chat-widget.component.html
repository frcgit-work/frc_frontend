<div class="chat-widget">
  <section
    *ngIf="isOpen"
    class="chat-panel"
    role="dialog"
    aria-label="СЗХ туслах чат"
    aria-modal="false"
  >
    <header class="chat-header">
      <div class="assistant-avatar" aria-hidden="true">СЗХ</div>
      <div class="assistant-details">
        <h2>СЗХ туслах</h2>
        <span><i aria-hidden="true"></i> Түгээмэл асуулт, хариулт</span>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-button" aria-label="Шинэ чат эхлүүлэх" title="Шинэ чат" (click)="startNewChat()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4" /></svg>
        </button>
        <button type="button" class="icon-button" aria-label="Чатыг хаах" title="Хаах" (click)="closeChat()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
    </header>

    <div #messagesViewport class="chat-messages" aria-live="polite" aria-relevant="additions text">
      <div
        *ngFor="let message of messages"
        class="message-row"
        [class.message-row--user]="message.role === 'user'"
      >
        <div *ngIf="message.role === 'assistant'" class="message-avatar" aria-hidden="true">С</div>
        <div class="message-bubble" [class.message-bubble--user]="message.role === 'user'">
          {{ message.text }}
        </div>
      </div>

      <section *ngIf="!selectedCategory" class="faq-picker" aria-label="Түгээмэл асуултын ангиллууд">
        <p class="faq-picker__title">Ангилал сонгоно уу</p>
        <button
          *ngFor="let category of categories"
          type="button"
          class="faq-picker__option faq-picker__category"
          (click)="selectCategory(category.name)"
        >
          <span>{{ category.name }}</span>
          <span class="faq-picker__count">{{ category.questionCount }}</span>
        </button>
      </section>

      <section *ngIf="selectedCategory" class="faq-picker" aria-label="Асуултууд">
        <div class="faq-picker__heading">
          <p class="faq-picker__title">{{ selectedCategory }} · Асуултаа сонгоно уу</p>
          <button type="button" class="faq-picker__back" (click)="showCategories()">Ангилал солих</button>
        </div>
        <button
          *ngFor="let faq of activeQuestions"
          type="button"
          class="faq-picker__option faq-picker__question"
          (click)="selectQuestion(faq)"
        >
          {{ faq.question }}
        </button>
      </section>
    </div>

    <a
      class="messenger-contact"
      [href]="messengerUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook Messenger-ээр ажилтантай холбогдох"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 0 0-7.3 12.9L4 21l4.8-2.5a8.7 8.7 0 0 0 3.2.6 8.5 8.5 0 1 0 0-17.1Z"/><path d="m7.8 14.1 3.1-3.3 2.3 1.8 3-3.2-3.1 3.3-2.3-1.8-3 3.2Z"/></svg>
      <span>Messenger-ээр ажилтантай холбогдох</span>
      <span class="messenger-contact__arrow" aria-hidden="true">↗</span>
    </a>
    <p class="demo-note">Excel FAQ-н туршилтын өгөгдөл · Албан ёсны баталгаат хариулт биш</p>
  </section>

  <button
    *ngIf="!isOpen"
    type="button"
    class="chat-launcher"
    aria-label="СЗХ туслах чатыг нээх"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen"
    (click)="openChat()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 2 1.4-4.2A7.5 7.5 0 1 1 20 11.5Z" /><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01" /></svg>
    <span>Чатлах</span>
  </button>
</div>
