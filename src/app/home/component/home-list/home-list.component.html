<div class="md:p-5 pb-5 mb-5 mt-5" *ngIf="listcount>0">
    <div class="container">
        <div class="heading-title">
            <div *ngIf="siteinfo.lang==='mn'">
                <div class="d-flex justify-content-between align-items-center">
                    <h3><a routerLink="/list/61">Хуралдааны тойм</a></h3>
                    <span><a routerLink="/list/61">Бүх мэдээ...</a></span>
                </div>
            </div>
            <div *ngIf="siteinfo.lang==='en'">
                <div class="d-flex justify-content-between align-items-center">
                    <h3><a routerLink="/list/616">News</a></h3>
                    <span><a routerLink="/list/616">More...</a></span>
                </div>
            </div>
            <span class="about-us__hr"></span>
        </div>
        <div>
            <div class="row shafull-container1">
                <div class="col-lg-3 col-md-6 shaf-item pl-0" *ngFor="let item of newslist">
                    <div class="folio-item-2 news-item">
                        <div class="news-item__img">
                            <a routerLink="/view/{{item.iDs}}">
                                <img src="{{getimg(item.picurl)}}" alt="" class="img-fluid">
                            </a>
                        </div>

                        <div class="folio-content">
                            <div class="cats-1 nowrap"><a routerLink="/view/{{item.iDs}}">{{item.subject}}</a></div>
                            <div class="biMeta">
                                <a routerLink="/view/{{item.iDs}}">
                                    <i class="icon_clock_alt"></i>
                                    {{parseDates(item.ognoo)}}</a>
                            </div>
                            <!-- <a class="fm-more" routerLink="/view/{{item.iDs}}"><i class="nss-arrow-right"></i></a> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div role="status" class="text-center" *ngIf="!newslist">
            <div class="spinner-grow text-color-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>

        </div> -->

</div>
