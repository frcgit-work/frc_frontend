<div class="mb-5 mt-5" *ngIf="list.length>0">
    <div class="container uk-position-relative" style="z-index: 0;">
        <div class="heading-title">
            <h3 *ngIf="siteinfo.lang==='mn'">Зохицуулалттай салбарын голлох үзүүлэлт /PowerBi дашбоард/</h3>
            <h3 *ngIf="siteinfo.lang==='en'">PowerBi dashboard</h3>
            <span class="about-us__hr"></span>
        </div>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation" *ngFor="let item of list let i=index">
                <button class="nav-link" [ngClass]="{'active': tabid===item.iDs}" (click)="tab(item)" id="home-tab"
                    data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab" aria-controls="home"
                    aria-selected="true">{{item.tabtitle}}</button>
            </li>
        </ul>
        <div class="tab-content overflow" style="z-index: 0;">

            <div class="tab-pane fade border border-1 border-top-0 show active" style="z-index: 0;">
                <div class="p-5 uk-position-relative min-width" style="z-index: 0;">
                    <div class="row shafull-container1">
                        <iframe
                            [src]="embedUrl(taburl)"
                            style="height:800px;width:100%"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
