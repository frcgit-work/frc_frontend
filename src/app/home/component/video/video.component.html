<div class="mb-5 mt-5" *ngIf="listcount>0">
    <div class="container">
        <div class="heading-title">
            <div *ngIf="siteinfo.lang==='mn'">
                <div class="d-flex justify-content-between align-items-center">
                    <h3><a routerLink="/video/65">Видео</a></h3>
                    <span><a routerLink="/video/65">Бүх видео...</a></span>
                </div>
            </div>
            <div *ngIf="siteinfo.lang==='en'">
                <div class="d-flex justify-content-between align-items-center">
                    <h3><a routerLink="/video/616">Video</a></h3>
                    <span><a routerLink="/video/616">More...</a></span>
                </div>
            </div>
        </div>

        <div class="tab-content">
            <div class="row shafull-container1">
                <div class="col-lg-4 col-md-6 shaf-item pl-0 video-item" *ngFor="let item of list">
                    <!-- <div class="folio-item-2 ">
                        <iframe [src]="embedUrl(item.embed)" width="1920" height="1080" allowfullscreen
                            uk-responsive></iframe>
                    </div> -->

                    <div class="video-item ">
                        <div class="mt-1" *ngIf="item.picurl">
                            <img src="{{getimg(item.picurl)}}" class="img-fluid" alt="">
                            <div class="tw-video-icon open-video" (click)="mediaopen(item)">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1"
                                    stroke="currentColor" class="w-6 h-6 p-2 text-white">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112z" />
                                </svg>
                            </div>
                        </div>
                        <div class="embed-responsive embed-responsive-16by9 mt-1" *ngIf="!item.picurl">
                            <iframe class="embed-responsive-item" [src]="embedUrl(item.embed)" height="270px"
                                allowfullscreen></iframe>
                        </div>
                    </div>
                    <div class="folio-item-2 ">
                        <div class="folio-content">
                            <div class="cats-1 nowrap">
                                <a routerLink="/video-view/{{item.ids}}">{{item.title}}</a>
                                <div class="biMeta">
                                    <a routerLink="/view/{{item.iDs}}">
                                        <i class="icon_clock_alt"></i> {{parseDates(item.ognoo)}}</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div role="status" class="text-center" *ngIf="!list">
            <div class="spinner-grow text-color-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>

    </div>
</div>

<div id="modal-center" class="uk-flex-top uk-modal uk-flex uk-open" *ngIf="videomodal" uk-modal>
    <div class="uk-modal-dialog uk-margin-auto-vertical">
        <button class="uk-modal-close-default" type="button" (click)="videomodal=false" uk-close></button>
        <h6 class="uk-modal-title1 px-4 pt-4">{{videoinfo.title}}</h6>
        <div class="pb-4">
            <iframe class="embed-responsive-item w-full" [src]="embedUrl(videoinfo.embed)" allowfullscreen></iframe>
            <!-- <span [innerHTML]="getHTML(pagelist[0].info)"></span> -->
        </div>
        <div class="px-4 pb-4 ">
            <span class="text-justify infotext" [innerHTML]="videoinfo.info"></span>
        </div>
        <div class="text-right px-4 pb-4">
            <a routerLink="/video-view/{{videoinfo.ids}}">
                <div *ngIf="siteinfo.lang==='mn'">Дэлгэрэнгүй...</div>
                <div *ngIf="siteinfo.lang==='en'">More</div>
            </a>
        </div>
        <!-- <img src="http://66.181.165.129/resources/Images/Slide/202203/225310806-photo-2022-02-01-10-32-13.jpg"
                                                class="img-fluid bannerimage"> -->
    </div>
</div>
