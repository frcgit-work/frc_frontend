<div class="mb-5 mt-5">
    <div class="container">

        <div class="heading-title">
            <h3 *ngIf="siteinfo.lang==='mn'">Тайлан мэдээ</h3>
            <h3 *ngIf="siteinfo.lang==='en'">Report</h3>
            <span class="about-us__hr"></span>
        </div>

        <div class="overflow">
            <ul class="nav nav-tabs min-width" id="myTab" role="tablist">
                <li class="nav-item" role="presentation" *ngFor="let item of tablist let i=index">
                    <button class="nav-link" [ngClass]="{'active': tabname==='tab' + item.ids}" (click)="tab(item)"
                        id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab"
                        aria-controls="home" aria-selected="true">{{item.label}}</button>
                </li>
            </ul>
        </div>
        <div class="tab-content">
            <div class="tab-pane fade border border-1 border-top-0 show active">
                <div class="p-2">
                    <div class="p-2 text-right heading-title" *ngIf="siteinfo.lang==='mn'">
                        <a [routerLink]="['/doc/list',{id:activemenu}]">Дэлгэрэнгүй...</a>
                    </div>
                    <div class="p-2 text-right heading-title" *ngIf="siteinfo.lang==='en'">
                        <a [routerLink]="['/doc/list',{id:activemenu}]">More...</a>
                    </div>
                    <div uk-slider class="uk-position-relative">
                        <div class="uk-position-relative uk-visible-toggle uk-light" tabindex="-1">
                            <ul
                                class="uk-slider-items uk-child-width-1-2 uk-child-width-1-3@s uk-child-width-1-4@m uk-child-width-1-5@l uk-child-width-1-6@xl">
                                <li *ngFor="let item of doclist" class="card-group">
                                    <a href="{{item.fileurl}}" style="display: flex;" target="_blank">
                                        <div class="uk-card uk-card-default shadow-md w-100 p-3 card">
                                            <div class="uk-card-media-top text-center reportimg">
                                                <img *ngIf="!item.picurl" src="/assets/images/logo2.png"
                                                    class="m-auto pointerimage">
                                                <img *ngIf="item.picurl" src="{{getimg(item.picurl)}}"
                                                    class="m-auto pointerimage">
                                            </div>
                                            <div class="uk-card-body1 pt-3">
                                                <div class="card-title text-uppercase">{{item.subject}}</div>
                                            </div>
                                        </div>
                                    </a>
                                </li>
                            </ul>

                            <!-- <a class="uk-position-center-left uk-position-small text-black-50" href="#"
                                uk-slidenav-previous uk-slider-item="previous"></a>
                            <a class="uk-position-center-right uk-position-small text-black-50" href="#"
                                uk-slidenav-next uk-slider-item="next"></a> -->

                        </div>
                        <div role="status" class="text-center" *ngIf="!doclist">
                            <div class="spinner-grow text-color-primary" role="status">
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>
                        <div role="status" class="text-center uk-width-1-1 uk-position-absolute uk-position-cover"
                            *ngIf="loading">
                            <div class="uk-position-center">
                                <div class="spinner-grow text-color-primary" role="status">
                                    <span class="sr-only">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
