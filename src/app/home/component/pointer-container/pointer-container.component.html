        <div uk-slider>
            <div class="uk-position-relative uk-visible-toggle uk-light" tabindex="-1">
                <ul
                    class="uk-slider-items uk-child-width-1-1 uk-child-width-1-2@s uk-child-width-1-4@m uk-child-width-1-6@l uk-child-width-expand@xl zindex">
                    <li *ngFor="let item of slidelist">
                        <a href="{{item.link}}" style="height: 100%;display: flex;">
                            <div class="uk-card uk-card-default shadow-none border border-1 w-100 pt-2">
                                <div class="uk-card-media-top text-center">
                                    <img src="{{item.picurl}}" class="mx-auto pointerimage">
                                </div>
                                <div class="uk-card-body">
                                    <p class="card-title">{{item.titlename}}</p>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>

                <a class="uk-position-center-left uk-position-small text-black-50 zindex1 d-none d-lg-block" href="#"
                    uk-slidenav-previous uk-slider-item="previous"></a>
                <a class="uk-position-center-right uk-position-small text-black-50 zindex1 d-none d-lg-block" href="#"
                    uk-slidenav-next uk-slider-item="next"></a>

            </div>

        </div>
        <div role="status" class="text-center" *ngIf="!slidelist">
            <div class="spinner-grow text-color-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
