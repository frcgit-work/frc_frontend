<div class="mb-5 mt-5" *ngIf="chartcount>0">
    <div class="container uk-position-relative" style="z-index: 0;">
        <div class="heading-title">
            <h3 *ngIf="siteinfo.lang==='mn'">Индекс</h3>
            <h3 *ngIf="siteinfo.lang==='en'">Index</h3>
            <span class="about-us__hr"></span>
        </div>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation" *ngFor="let item of chart let i=index">
                <button class="nav-link" [ngClass]="{'active': charttab===item.iDs}" (click)="tab(item)" id="home-tab"
                    data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab" aria-controls="home"
                    aria-selected="true">{{item.shortname}}</button>
            </li>
        </ul>
        <div class="tab-content overflow" style="z-index: 0;">

            <div class="tab-pane fade border border-1 border-top-0 show active" style="z-index: 0;">
                <div class="p-5 uk-position-relative min-width" style="z-index: 0;">
                    <div class="p-2 uk-position-relative" id='homechart' style="z-index: 0;"></div>
                    <div role="status" class="text-center uk-width-1-1 uk-position-absolute uk-position-cover"
                        *ngIf="loading">
                        <div class="uk-position-center">
                            <div class="spinner-grow text-color-primary" role="status">
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- <div class="heading-sub-title">
            <h4>{{chartname}}</h4>
        </div>
        <google-chart class="chart" id="chart1" #chart1 [type]="type" [data]="chartData.data"
            [columnNames]="chartData.columnNames" [options]="chartData.classicOptions">
        </google-chart> -->
    </div>
</div>
