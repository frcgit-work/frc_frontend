<div id="carouselExampleControls" class="carousel slide" data-ride="carousel" *ngIf="listcount>0">
    <div class="carousel-inner d-flex align-items-center">
        <div class="carousel-item" *ngFor="let item of slidelist let i=index" [ngClass]="i===0? 'active': ''">
            <div [ngStyle]="{'background-image': getUrl(item.picurl)}" class="w-100 homeslide"></div>
            <div class="carousel-caption col-md-4 col-sm-8 col-8 absolute text-center">
                <a routerLink="/view/{{item.ids}}">
                    <h5 class="text-xl mb-2">{{item.titlename}}</h5>
                    <div class="slidemore" id="homelistinfo" [innerHTML]="item?item.titleinfo:''"></div>
                </a>
            </div>
        </div>

    </div>
    <button class="carousel-control-prev d-none d-lg-block" type="button" data-target="#carouselExampleControls"
        data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
    </button>
    <button class="carousel-control-next d-none d-lg-block" type="button" data-target="#carouselExampleControls"
        data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
    </button>
</div>
